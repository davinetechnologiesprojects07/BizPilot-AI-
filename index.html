<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#f6f8fc">
  <title>BizPilot AI — Business Productivity Workspace</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="app-shell">
    <aside class="sidebar" id="sidebar">
      <a class="brand" href="#" data-page="dashboard" aria-label="BizPilot AI home">
        <img class="brand-logo" src="bizpilot-logo.png" alt="BizPilot AI logo" width="1983" height="793">
      </a>
      <div class="workspace-label">WORKSPACE</div>
      <nav class="nav-list" aria-label="Main navigation">
        <button class="nav-item active" data-page="dashboard"><span class="nav-icon">▦</span>Dashboard</button>
        <div class="nav-caption">CREATE</div>
        <button class="nav-item" data-page="writing"><span class="nav-icon">✎</span>AI Writing Studio</button>
        <button class="nav-item" data-page="reports"><span class="nav-icon">▤</span>Business Reports</button>
        <button class="nav-item" data-page="meetings"><span class="nav-icon">▣</span>Meeting Assistant</button>
        <button class="nav-item" data-page="actions"><span class="nav-icon">☑</span>Action Items</button>
        <button class="nav-item" data-page="research"><span class="nav-icon">⌕</span>Research Summarizer</button>
        <div class="nav-caption">ORGANIZE</div>
        <button class="nav-item" data-page="prompts"><span class="nav-icon">◇</span>Prompt Library</button>
        <button class="nav-item" data-page="workflow"><span class="nav-icon">↗</span>Workflow Center <span class="nav-pill">CORE</span></button>
        <button class="nav-item" data-page="activity"><span class="nav-icon">◷</span>Usage &amp; Activity</button>
        <div class="nav-caption">PREFERENCES</div>
        <button class="nav-item" data-page="settings"><span class="nav-icon">⚙</span>Settings</button>
        <button class="nav-item" data-page="help"><span class="nav-icon">?</span>Help &amp; Documentation</button>
      </nav>
      <div class="sidebar-bottom">
        <div class="mode-card"><span class="mode-dot"></span><div><strong>Demo Mode active</strong><small>Works without an API key</small></div></div>
        <div class="user-row"><div class="avatar">BP</div><div class="user-copy"><strong>Workspace user</strong><small>Personal workspace</small></div><button class="icon-button" title="Settings" data-page="settings">···</button></div>
      </div>
    </aside>

    <main class="main-area">
      <header class="topbar">
        <div class="topbar-left"><button class="mobile-menu icon-button" id="menuToggle" aria-label="Open navigation">☰</button><div class="breadcrumb">Workspace <span>/</span> <strong id="crumb">Dashboard</strong></div></div>
        <div class="topbar-right"><span class="mode-chip"><span class="mode-dot"></span>Demo Mode</span><button class="help-top" data-page="help"><span>?</span> Help</button><div class="avatar avatar-small">BP</div></div>
      </header>
      <div id="view" class="page-content" tabindex="-1"></div>
      <footer class="footer"><span>BizPilot AI <span class="footer-sep">·</span> Built for thoughtful work</span><span>AI-assisted drafts require human review.</span></footer>
    </main>
  </div>
  <div id="toastRegion" class="toast-region" aria-live="polite" aria-atomic="true"></div>
  <script src="js/prompts.js"></script>
  <script src="js/generator.js"></script>
  <script src="app.js"></script>
</body>
</html>
